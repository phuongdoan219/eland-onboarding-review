    if(flow==='survey'){
      const signupParams=new URLSearchParams({from:'guest-profile',map:mapKey});
      const signupHref='../index.html?'+signupParams.toString();
      return `<section class="card account-card guest-account-card" aria-labelledby="guest-account-title"><h2 id="guest-account-title">Tạo tài khoản phụ huynh</h2><p>Có tài khoản, phụ huynh có thể đăng nhập ELand khi quay lại.</p><a class="button primary" href="${escape(signupHref)}">Tạo tài khoản</a></section>`;
    }
    const me=learner();
    return `<div class="profile-layout"><section class="card account-card"><div class="account-identity"><button class="avatar-button" data-action="profile-edit" aria-label="Thay ảnh đại diện">${avatar(me,'profile-avatar')}</button><div><h2>${escape(me.name||'Bạn nhỏ')}</h2></div></div><dl class="account-fields"><div><dt>Số điện thoại</dt><dd class="${me.phone?'':'not-set'}">${escape(me.phone||'Chưa cập nhật')}</dd></div></dl><button class="button quiet profile-edit" data-action="profile-edit">Chỉnh sửa</button></section><section class="card proficiency-card"><div class="card-heading"><h2>Trình độ của con</h2></div><div class="feature-placeholder"><p class="availability-message">Chưa có đánh giá trình độ.</p></div></section></div>`;
  }

  function unavailablePage(){const title=state.view==='ranking'?'Bảng xếp hạng':'Báo cáo học tập';return '<section class="card feature-placeholder" aria-label="'+title+'"><p class="availability-message">'+title+' chưa khả dụng.</p></section>';}
  function notify(message){const el=$('#toast');el.textContent=message;el.classList.add('shown');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('shown'),5000);}
  function showDialog(title,body){
    opener=document.activeElement;$('#dialog-content').innerHTML=`<div class="dialog-heading"><h2 id="dialog-title">${title}</h2><button class="icon-button" data-action="close" aria-label="Đóng">${icon('close')}</button></div>${body}`;
    const el=$('#dialog');if(el.showModal)el.showModal();else el.setAttribute('open','');el.querySelector('button')?.focus();
  }
  function closeDialog(){const el=$('#dialog');if(el.close)el.close();else el.removeAttribute('open');opener?.focus?.();}

  function editProfile(){
    const p=state.profile;showDialog('Chỉnh sửa hồ sơ',`<form id="profile-form"><div class="edit-profile-top">${avatar(learner(),'profile-avatar')}<label class="field">Ảnh đại diện<input id="profile-photo" type="file" accept="image/png,image/jpeg,image/webp"><small>PNG, JPG hoặc WebP · tối đa 2 MB</small></label></div><div class="profile-form-grid"><label class="field">Tên gọi<input id="profile-name" value="${escape(p.name)}" maxlength="40" required autocomplete="off"></label><label class="field">Số điện thoại<input id="profile-phone" type="tel" value="${escape(p.phone)}" placeholder="Chưa cập nhật" maxlength="20" autocomplete="off"></label></div><p id="profile-error" class="form-error" role="alert"></p><button class="button primary full" type="submit">Lưu thông tin ${icon('check')}</button></form>`);
  }
  function saveProfile(){
    const name=$('#profile-name').value.trim(),phone=$('#profile-phone').value.trim(),photo=$('#profile-photo').files?.[0];
    let error='';
    if(!name||name.length>40)error='Tên gọi cần từ 1 đến 40 ký tự.';
    else if(phone&&!/^\+?[\d\s().-]{8,20}$/.test(phone))error='Số điện thoại chưa đúng định dạng.';
    else if(photo&&(!['image/png','image/jpeg','image/webp'].includes(photo.type)||photo.size>2*1024*1024))error='Chọn ảnh PNG, JPG hoặc WebP không quá 2 MB.';
    if(error){$('#profile-error').textContent=error;return;}
    let imageUri=state.profile.imageUri;if(photo){if(imageUri)URL.revokeObjectURL(imageUri);imageUri=URL.createObjectURL(photo);}
    state.profile={name,phone,imageUri};closeDialog();shell();notify('Đã cập nhật hồ sơ.');
  }

  document.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b||b.disabled)return;
    if(['profile','ranking'].includes(b.dataset.view)){state.view=b.dataset.view;shell();window.scrollTo?.(0,0);return;}
    if(b.dataset.action==='profile-edit')editProfile();
    if(b.dataset.action==='close')closeDialog();
  });
  document.addEventListener('submit',e=>{if(e.target.id==='profile-form'){e.preventDefault();saveProfile();}});
  $('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog'))closeDialog();});
  $('#dialog').addEventListener('cancel',()=>opener?.focus?.());
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#dialog').hasAttribute('open'))closeDialog();});
  shell();
})();

</script>
</body>
</html>
