    if(pointers.size>1){suppressUntil=performance.now()+300;}
  });

  document.addEventListener('keydown',e=>{
    if(!$('#overlay').hidden){
      if(e.key==='Escape'){e.preventDefault();closeDialog();return;}
      if(e.key==='Tab'){
        const nodes=$$('#dialog button:not([disabled]),#dialog a[href],#dialog input:not([disabled]),#dialog select:not([disabled]),#dialog textarea:not([disabled]),#dialog summary,#dialog [tabindex="0"]').filter(n=>{const details=n.closest('details');return !n.closest('[hidden]')&&(!details||details.hasAttribute('open')||n.tagName==='SUMMARY');}),first=nodes[0],last=nodes[nodes.length-1];
        if(e.shiftKey&&(document.activeElement===first||document.activeElement===$('#dialog'))){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}
      }return;
    }
    if(e.target.closest?.('input,textarea,select'))return;
    const keys=['+','=','-','_','Home','End','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'];if(!keys.includes(e.key))return;
    if(e.key.startsWith('Arrow')&&e.target.closest?.('.ui'))return;
    e.preventDefault();if(e.key==='Home')fit();else if(e.key==='End')locate();else if(e.key==='+'||e.key==='=')zoom(1.25);else if(e.key==='-'||e.key==='_')zoom(.8);else{camera.pan(e.key==='ArrowLeft'?100:e.key==='ArrowRight'?-100:0,e.key==='ArrowUp'?100:e.key==='ArrowDown'?-100:0);render();}
  });
  window.addEventListener('resize',()=>{const r=stage.getBoundingClientRect();camera.resize(r.width,r.height);if(overview)camera.fitWorld();render();});
  window.WonderlandMapDemo={getSnapshot:()=>({completed:state.completed,active:state.active,selected:state.selected,zone,overview,pointerCount:pointers.size,camera:{x:camera.x,y:camera.y,scale:camera.scale,min:camera.min,max:camera.max,width:camera.width,height:camera.height}})};
  goZone(zone);state.selected=state.active;updateContent();if(window.location?.hash==='#toan-canh')fit();
})();
