    const panes = new Map(Array.from(root.querySelectorAll('[data-pane]'), pane => [pane.dataset.pane, pane]));
    const questions = ['survey-1', 'survey-2', 'survey-3'];
    const login = root.querySelector('[data-form="login"]');
    const signup = root.querySelector('[data-form="signup"]');
    const confirmation = signup.querySelector('[data-confirm]');
    const successDialog = root.querySelector('#eland-signup-success-dialog');
    const continueButton = successDialog.querySelector('[data-success-continue]');
    const signupBack = root.querySelector('[data-signup-back]');
    const routeSwitch = root.querySelector('[data-route-switch]');
    // The map keys follow the four grade groups shown in question 1.
    const maps = {
      'pre-a1': '06d-map-noi-cau-20-unit.html',
      a1: '07-map-a1-rung-thi-tham-30-unit.html',
      'pre-a2': '08-map-prea2-vuong-quoc-pha-le-20-unit.html',
      a2: '09-map-a2-thanh-pho-phieu-luu-30-unit.html'
    };
    const gradeMapKeys = Object.keys(maps);
    const params = new URLSearchParams(window.location.search);
    const sourceMap = params.get('map');
    const source = params.get('from');
    const fromGuest = Object.hasOwn(maps, sourceMap) && ['guest-profile', 'guest-map', 'guest-survey'].includes(source);
    const editing = fromGuest && source === 'guest-survey';
    const defaultMap = new URL('./maps/' + maps[gradeMapKeys[0]], window.location.href);
    const initialPane = editing ? questions[0] : fromGuest ? 'signup' : 'welcome';
    const answersKey = 'eland:onboarding-answers-v2';
    const previousAnswersKey = 'eland:onboarding-answers-v1';
    const historyKey = 'elandOnboarding';
    let current;
    let gradeAtEntry;
    let answers = Array(questions.length).fill(null);

    const validChoice = value => Number.isInteger(value) && value >= 0 && value < 4;

    function loadAnswers() {
      try {
        const stored = sessionStorage.getItem(answersKey);
        const migrating = stored === null;
        const saved = JSON.parse(migrating ? sessionStorage.getItem(previousAnswersKey) : stored);
        if (!Array.isArray(saved)) return;
        // The old first answer measured confidence, not grade.
        answers = questions.map((_, index) =>
          (!migrating || index > 0) && validChoice(saved[index]) ? saved[index] : null
        );
        if (migrating) sessionStorage.setItem(answersKey, JSON.stringify(answers));
      } catch {
        // Keep the in-memory choices if session storage is unavailable.
      }
    }

    function choose(index, choice) {
      answers[index] = choice;
      try {
        sessionStorage.setItem(answersKey, JSON.stringify(answers));
      } catch {
        // The current page can still show and change choices.
      }
    }

    function mapUrl(flow, mapKey = fromGuest ? sourceMap : gradeMapKeys[0]) {
      const url = new URL(maps[mapKey], defaultMap);
      url.searchParams.set('flow', flow);
      if (fromGuest && params.get('view') === 'overview') url.hash = 'toan-canh';
      return url;
    }

    function returnToGuestSource() {
      const url = source === 'guest-profile' ? new URL('10-tien-do.html', defaultMap) : mapUrl('survey');
      if (source === 'guest-profile') url.search = new URLSearchParams({ map: sourceMap, flow: 'survey' });

      // Use the original history entry when reached from its link in this tab.
      const referrer = document.referrer && new URL(document.referrer);
      if (referrer && current.depth + 1 < history.length &&
          referrer.origin === url.origin && referrer.pathname === url.pathname &&
          (source !== 'guest-profile' || referrer.searchParams.get('map') === sourceMap) &&
          (referrer.searchParams.get('flow') || 'survey') === 'survey') {
        history.go(-current.depth - 1);
      } else {
        window.location.replace(url.href);
      }
    }

    function clearPasswords(form) {
      for (const field of form.querySelectorAll('input[type="password"]')) field.value = '';
      if (form === signup) confirmation.setCustomValidity('');
    }

    function render(entry, focus = true) {
      if (answers[0] === null && questions.indexOf(entry.pane) > 0) {
        entry = { ...entry, pane: questions[0] };
        storeEntry(entry, true);
      }
      const name = entry.pane;
      const previous = current?.pane;
      if (previous === 'login' && name !== 'login') clearPasswords(login);
      if (previous === 'signup' && name !== 'signup') clearPasswords(signup);
      current = entry;

      const showingSuccess = name === 'signup-success';
      const pane = panes.get(showingSuccess ? 'signup' : name);
      if (successDialog.open && !showingSuccess) successDialog.close();
      for (const screen of panes.values()) screen.hidden = screen !== pane;
      survey.hidden = !survey.contains(pane);

      const index = questions.indexOf(name);
      routeSwitch.hidden = index < 1 && (name !== 'signup' || fromGuest);
      let selected;
      if (index >= 0) {
        const choice = answers[index];
        for (const option of pane.querySelectorAll('[data-answer]')) {
          const pressed = Number(option.dataset.answer) === choice;
          option.setAttribute('aria-pressed', String(pressed));
          if (pressed) selected = option;
        }
      }

      if (showingSuccess) {
        if (!successDialog.open) successDialog.showModal();
        continueButton.focus({ preventScroll: true });
      } else if (focus) {
        const heading = pane.querySelector('h1');
        heading.tabIndex = -1;
        window.scrollTo(0, 0);
        (selected || heading).focus({ preventScroll: true });
      }
    }

    function readEntry(state) {
      const entry = state?.[historyKey];
      if (entry && (panes.has(entry.pane) || entry.pane === 'signup-success') &&
          Number.isInteger(entry.depth) && entry.depth >= 0) return entry;
      return { pane: initialPane, previous: null, depth: 0 };
    }

    function storeEntry(entry, replace) {
      const stored = editing ? { ...entry, gradeAtEntry } : entry;
      history[replace ? 'replaceState' : 'pushState']({ [historyKey]: stored }, '');
    }

    function goTo(pane, replace = false) {
      if (pane === current.pane) return;
      const entry = {
        pane,
        previous: replace ? current.previous : current.pane,
        depth: current.depth + (replace ? 0 : 1)
      };
      storeEntry(entry, replace);
      render(entry);
    }

    function goBack(pane) {
      if (current.previous === pane) history.back();
      else goTo(pane, true);
    }

    function openMap(flow, mapKey) {
      clearPasswords(login);
      clearPasswords(signup);
      window.location.assign(mapUrl(flow, mapKey).href);
    }

    function advanceSurvey(index) {
      if (answers[index] === null) return;
      if (index === questions.length - 1) {
        const grade = answers[0];
        const mapKey = editing && grade === gradeAtEntry ? sourceMap : gradeMapKeys[grade];
        openMap('survey', mapKey);
      } else {
        goTo(questions[index + 1]);
      }
    }

    root.addEventListener('click', event => {
      if (successDialog.open) return;
      const button = event.target.closest('button');
      if (!button) return;
      const index = questions.indexOf(current.pane);
      if (index >= 0 && button.hasAttribute('data-answer')) {
        choose(index, Number(button.dataset.answer));
        advanceSurvey(index);
      } else if (button === routeSwitch) {
        if (editing) returnToGuestSource();
        else goTo('welcome');
      } else if (button.dataset.back) {
        if ((editing && index === 0) || (fromGuest && button === signupBack)) returnToGuestSource();
        else goBack(button.dataset.back);
      } else if (button.dataset.show) {
        goTo(button.dataset.show);
      }
    });

    login.addEventListener('submit', event => {
      event.preventDefault();
      if (!login.reportValidity()) return;
      const account = login.querySelector('[data-account]');
      const password = login.querySelector('[data-password]');
      if (!account.value.trim() || password.value.length < 8) return;
      openMap('signup');
    });

    function validateConfirmation() {
      const password = signup.querySelector('[data-password]');
      confirmation.setCustomValidity(confirmation.value === password.value ? '' : 'Mật khẩu nhập lại chưa khớp.');
    }

    successDialog.addEventListener('cancel', event => event.preventDefault());
    continueButton.addEventListener('click', () => {
      if (successDialog.open) openMap('signup');
    });

    signup.addEventListener('input', validateConfirmation);
    signup.addEventListener('submit', event => {
      event.preventDefault();
      if (successDialog.open) return;
      validateConfirmation();
      if (!signup.reportValidity()) return;
      if (!/^0[0-9]{9}$/.test(signup.querySelector('[data-account]').value) ||
          signup.querySelector('[data-password]').value.length < 8) return;
      goTo('signup-success');
    });

    if (fromGuest && !editing) {
      signupBack.textContent = source === 'guest-profile' ? 'Quay lại hồ sơ' : 'Quay lại bản đồ';
    }
    if (editing) {
      panes.get(questions[0]).querySelector('[data-back]').setAttribute('aria-label', 'Quay lại bản đồ');
      routeSwitch.textContent = 'Về bản đồ';
    }

    window.addEventListener('popstate', event => {
      loadAnswers();
      render(readEntry(event.state));
    });
    window.addEventListener('pageshow', event => {
      if (!event.persisted) return;
      loadAnswers();
      render(readEntry(history.state), questions.includes(current.pane));
    });
    window.addEventListener('pagehide', () => {
      clearPasswords(login);
      clearPasswords(signup);
    });
    loadAnswers();
    const firstEntry = readEntry(history.state);
    if (editing) {
      const storedGrade = firstEntry.gradeAtEntry;
      gradeAtEntry = storedGrade === null || validChoice(storedGrade) ? storedGrade : answers[0];
    }
    storeEntry(firstEntry, true);
    render(firstEntry, firstEntry.pane !== 'welcome');
  })();
</script>

<script>
  (() => {
    const hero = document.querySelector('[data-pane="welcome"]');
    const button = hero.querySelector('[data-welcome-greeting]');
    const toggle = hero.querySelector('[data-welcome-motion-toggle]');
    const wolf = button.querySelector('.eland-wolf');
    const poseContainer = button.querySelector('.eland-wolf-poses');
    const star = button.querySelector('.eland-greeting-star');
    const butterfly = button.querySelector('.eland-welcome-butterfly');
    const cards = Array.from(button.querySelectorAll('.eland-flight-card'));
    const scene = hero.querySelector('[data-welcome-scene]');
    const stones = scene.querySelectorAll('[data-guide-step]');
    const spark = scene.querySelector('.eland-path-spark');
    const gate = scene.querySelector('.eland-gate-light');
    const motion = window.matchMedia('(prefers-reduced-motion: reduce)');
    const supportsAnimation = typeof butterfly.animate === 'function';
    const cycle = 12400;
    const timing = { duration: cycle, iterations: Infinity, easing: 'linear' };
    const poseSequence = [
      [0, '01'], [2220, '03'], [3470, '04'], [4830, '05'], [5700, '04'],
      [6330, '03'], [9510, '07'], [12230, '01'],
    ];
    let poseLayers = [];
    let posesRequested = false;
    let posesReady = false;
    let userPaused = false;
    let effects = [];
    let greeting = [];
    let stillTimer;

    for (const sprite of hero.querySelectorAll('.eland-motion-sprite')) {
      const image = sprite.querySelector('img');
      const showFallback = () => {
        image.hidden = true;
        sprite.setAttribute('data-fallback', '');
      };
      image.addEventListener('error', showFallback, { once: true });
      if (image.complete && !image.naturalWidth) showFallback();
    }

    const showOriginalWolf = () => { wolf.src = './assets/4d7588ca6aeeabd147669a4d.webp'; };
    if (wolf.complete && !wolf.naturalWidth) showOriginalWolf();
    else wolf.addEventListener('error', showOriginalWolf, { once: true });

    function preparePoses() {
      if (posesRequested) return;
      posesRequested = true;
      const ids = [...new Set(poseSequence.map(([, id]) => id))];
      const pending = ids.map(async id => {
        const image = new Image();
        image.className = 'eland-wolf-pose';
        image.alt = '';
        image.draggable = false;
        image.src = './assets/eland-welcome-pose-' + id + '.webp';
        await image.decode();
        return { id, image };
      });
      Promise.all(pending).then(layers => {
        poseLayers = layers;
        poseContainer.append(...layers.map(layer => layer.image));
      }).catch(() => {
        // The original mascot remains visible if the poses cannot be loaded.
      }).finally(() => {
        posesReady = true;
        syncPlayback();
      });
    }

    const phase = ms => ms / cycle;
    function flyAt(ms, left, top, wing, angle, opacity = 1) {
      return { left, top, opacity, offset: phase(ms),
        transform: 'translate(-50%, -50%) rotate(' + angle + 'deg) scaleX(' + wing + ')' };
    }

    function releaseCard(card, step, driftX, driftY, tilt) {
      const position = { left: step.left, top: step.top };
      const at = step.offset * cycle;
      const origin = 'translate(-50%, -50%) scale(.76)';
      const down = 'translate(-50%, -50%) translate(' + driftX + 'px, ' + driftY + 'px) rotate(' + tilt + 'deg)';
      const frames = [
        [0, 0, origin], [at - 1, 0, origin], [at, .55, origin], [at + 320, 1, down],
        [at + 1040, 1, down], [at + 1400, 0, down], [cycle, 0, down],
      ];
      return card.animate(frames.map(([ms, opacity, transform]) => ({
        ...position, opacity, transform, offset: phase(ms),
      })), timing);
    }

    function poseFrames(id) {
      const frames = [{ offset: 0, opacity: Number(id === poseSequence[0][1]) }];
      for (let index = 1; index < poseSequence.length; index++) {
        const [ms, current] = poseSequence[index];
        const prior = poseSequence[index - 1][1];
        if (id !== current && id !== prior) continue;
        frames.push(
          { offset: phase(ms - 105), opacity: Number(id === prior) },
          { offset: phase(ms), opacity: Number(id === current) },
        );
      }
      frames.push({ offset: 1, opacity: Number(id === poseSequence.at(-1)[1]) });
      return frames;
    }

    function startLoop() {
      const hi = flyAt(1200, 'var(--drop-hi-x)', '59%', .92, -12);
      const there = flyAt(2500, 'var(--drop-there-x)', '13%', .7, -16);
      const warm = flyAt(3800, '69%', '-5%', .95, 6);
      const welcome = flyAt(5100, '15%', '16%', .73, 15);
      const hand = flyAt(6600, '100%', '41%', .86, 5);
      const brand = flyAt(8000, 'var(--drop-brand-x)', '26%', 1, -13);
      effects = [
        butterfly.animate([
          flyAt(0, 'var(--drop-entry-x)', '72%', .83, -18, 0),
          flyAt(440, 'var(--drop-hi-x)', '67%', 1, -15),
          hi, flyAt(1840, 'var(--drop-there-x)', '38%', .83, -25), there,
          flyAt(3070, '88%', '0%', .97, -8), warm,
          flyAt(4460, '38%', '1%', .91, 10), welcome,
          flyAt(5580, '39%', '-5%', .86, -3),
          flyAt(5930, '71%', '-8%', 1, 9),
          flyAt(6300, '91%', '19%', .75, 9),
          hand, flyAt(7190, '100%', '41%', 1, 0), brand,
          flyAt(8930, 'var(--drop-entry-x)', '8%', .83, -21, 0),
          flyAt(cycle, 'var(--drop-entry-x)', '72%', .83, -18, 0),
        ], timing),
        releaseCard(cards[0], hi, 6, 17, -7),
        releaseCard(cards[1], there, 8, 16, 7),
        releaseCard(cards[2], warm, -7, 18, -7),
        releaseCard(cards[3], welcome, -8, 16, -7),
        releaseCard(cards[4], hand, 9, 20, 7),
        releaseCard(cards[5], brand, 7, 19, 6),
        ...poseLayers.map(({ id, image }) => image.animate(poseFrames(id), timing)),
      ];
      button.toggleAttribute('data-posed', poseLayers.length > 0);
    }

    function clearGreeting() {
      greeting.forEach(effect => effect.cancel());
      greeting = [];
      window.clearTimeout(stillTimer);
      star.removeAttribute('data-visible');
    }

    function syncPlayback() {
      const reduced = motion.matches || !supportsAnimation;
      const visible = !hero.hidden && !document.hidden;
      const running = !reduced && visible && !userPaused;
      const toggleLabel = userPaused ? 'Phát chuyển động' : 'Tạm dừng chuyển động';
      toggle.hidden = reduced;
      toggle.setAttribute('aria-label', toggleLabel);
      toggle.title = toggleLabel;
      toggle.toggleAttribute('data-paused', userPaused);
      hero.toggleAttribute('data-motion-paused', !running);

      if (reduced) {
        effects.forEach(effect => effect.cancel());
        effects = [];
        button.removeAttribute('data-posed');
        clearGreeting();
        return;
      }

      if (running && !effects.length) {
        if (posesReady) startLoop();
        else preparePoses();
      }

      for (const effect of [...effects, ...greeting]) {
        if (running && effect.playState === 'paused') effect.play();
        if (!running && effect.playState === 'running') effect.pause();
      }
    }

    new MutationObserver(syncPlayback).observe(hero, { attributes: true, attributeFilter: ['hidden'] });
    document.addEventListener('visibilitychange', syncPlayback);
    motion.addEventListener('change', syncPlayback);
    toggle.addEventListener('click', () => {
      userPaused = !userPaused;
      syncPlayback();
    });
    syncPlayback();

    button.addEventListener('click', () => {
      clearGreeting();
      if (motion.matches || !supportsAnimation || userPaused) {
        star.setAttribute('data-visible', '');
        stillTimer = window.setTimeout(() => star.removeAttribute('data-visible'), 550);
        return;
      }

      effects.forEach(effect => { effect.currentTime = 0; });
      greeting = [
        star.animate([
          { opacity: 0, transform: 'scale(.55)' },
          { opacity: 1, transform: 'scale(1)', offset: .28 },
          { opacity: 0, transform: 'translateY(-8px) scale(.82)' },
        ], { duration: 710, easing: 'ease-out' }),
        spark.animate([
          { left: 'var(--stone-x1)', top: 'var(--stone-y1)', opacity: 0 },
          { left: 'var(--stone-x1)', top: 'var(--stone-y1)', opacity: 1, offset: .12 },
          { left: 'var(--stone-x2)', top: 'var(--stone-y2)', opacity: 1, offset: .36 },
          { left: 'var(--stone-x3)', top: 'var(--stone-y3)', opacity: 1, offset: .63 },
          { left: 'var(--gate-x)', top: 'var(--gate-y)', opacity: 1, offset: .9 },
          { left: 'var(--gate-x)', top: 'var(--gate-y)', opacity: 0 },
        ], { duration: 1480, delay: 210, easing: 'linear' }),
        ...Array.from(stones, (stone, index) => stone.animate([
          { opacity: 0 },
          { opacity: .89, offset: .31 },
          { opacity: 0 },
        ], { duration: 580, delay: [310, 690, 1070][index], easing: 'ease-out' })),
        gate.animate([
          { opacity: 0 },
          { opacity: .84, offset: .37 },
          { opacity: 0 },
        ], { duration: 610, delay: 1520, easing: 'ease-in-out' }),
      ];
    });
  })();
</script>
